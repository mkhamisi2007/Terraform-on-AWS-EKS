apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  storageClassName: efs-sc-static
  persistentVolumeReclaimPolicy: Retain
  accessModes:
  - ReadWriteMany
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0ce4cf8bfebb2a188
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-static-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc-static # refer to storage class resource
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efs-nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: efs-nginx
  template:
    metadata:
      labels:
        app: efs-nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        volumeMounts:
        - name: efs-volume
          mountPath: /data
      volumes:
      - name: efs-volume
        persistentVolumeClaim:
          claimName: efs-static-pvc