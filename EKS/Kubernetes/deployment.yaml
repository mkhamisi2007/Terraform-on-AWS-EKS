apiVersion: apps/v1
kind: Deployment
metadata:
  name:  myapp-deployment
spec:
  selector:
    matchLabels:
      app: myapp
  replicas: 2
  template:
    metadata:
      name:  myapp-pod
      labels:
        app:  myapp #--> this label is used in service selector
    spec:
      containers:
      - name:  myapp-container
        image:  nginxdemos/hello:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service-clb
spec:
  type: LoadBalancer # --> for AWS EKS, this will create an CLB(classic LB) in AWS
  selector:
    app: myapp
  ports:
  - name: myapp
    protocol: TCP
    port: 80
    targetPort: 80 # container port up in deployment
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service-nodeport
spec:
  type: NodePort # nodeport service will be exposed on worker nodes on a port in range 30000-32767. This is not recommended for production use, but can be used for testing or development purposes.
  selector:
    app: myapp
  ports:
  - name: myapp
    protocol: TCP
    port: 80
    targetPort: 80 # container port up in deployment
    nodePort: 30080 # this is the port on which service will be exposed on worker nodes. This should be in range 30000-32767
---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service-nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb # this annotation is used to specify that we want to create a NLB(Network Load Balancer) in AWS. This is the default load balancer type for AWS EKS, but we can specify it explicitly using this annotation.
spec:
  type: LoadBalancer # --> for AWS EKS, this will create an NLB(Network Load Balancer) in AWS
  selector:
    app: myapp
  ports:
  - name: myapp
    protocol: TCP
    port: 80
    targetPort: 80 # container port up in deployment
---
